<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradePulse Pro — Real-Time Stock Market Intelligence</title>
    <meta name="description" content="Institutional-grade stock market analytics platform with real-time tracking, technical indicators, and portfolio intelligence." />
    <!-- Preconnect Google Fonts for Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Immediate theme initialization to prevent theme flashing (Light mode is the hard default) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('tradepulse_theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            // Default is strictly light mode: do NOT query prefers-color-scheme
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-surface-light text-slate-800 antialiased selection:bg-brand-500 selection:text-white dark:bg-surface-darkBg dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
