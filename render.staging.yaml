services:
  - type: web
    name: tradepulse-pro-staging
    runtime: node
    plan: free
    region: ohio
    branch: staging
    autoDeployTrigger: off
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FINNHUB_API_KEY
        sync: false
